services:
  specter-agent:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SPECTER_DB_PATH: /app/data/app.db
      SPECTER_DATA_DIR: /app/data
      SPECTER_ARTIFACTS_DIR: /app/artifacts
      # No host runner. `specter serve` spawns agents itself, so there is no
      # second process to reach and no bridge to punch through.
      # Linear integration — set this to enable automatic failure logging
      SDLC_LINEAR_API_TOKEN: ${LINEAR_API_TOKEN:-}
      SDLC_LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-SPE}
      SDLC_LINEAR_PROJECT_NAME: ${LINEAR_PROJECT_NAME:-specter-agent}
    volumes:
      # Persistent host-mounted state. Do not remove these mounts unless you
      # intentionally want the container to run without durable local data.
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./secrets:/app/secrets
      - ./codebases:/app/codebases:ro
