services:
  specter-agent:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SPECTER_DB_PATH: /app/data/app.db
      SPECTER_DATA_DIR: /app/data
      SPECTER_ARTIFACTS_DIR: /app/artifacts
      # A container has no agent binary and no credentials, so agent execution
      # happens on the host: run `specter agent-host` there. Unset this to spawn
      # in-process instead, which is right when the backend runs natively.
      SPECTER_AGENT_HOST: ${SPECTER_AGENT_HOST-http://host.docker.internal:8765}
      # Linear integration — set this to enable automatic failure logging
      SDLC_LINEAR_API_TOKEN: ${LINEAR_API_TOKEN:-}
      SDLC_LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-SPE}
      SDLC_LINEAR_PROJECT_NAME: ${LINEAR_PROJECT_NAME:-specter-agent}
    # host.docker.internal resolves automatically on Docker Desktop but NOT on
    # Linux, where the agent host would be unreachable without this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent state lives under the user's home, not in this checkout.
      # Deleting the repository would otherwise delete the run history and the
      # key that decrypts every stored credential — and the CLI defaults to the
      # same directory, so both read one database instead of whichever one the
      # current working directory happens to contain.
      #
      # SPECTER_HOME overrides it. That matters where $HOME is set but empty
      # (some CI and systemd contexts), because the :- default only fires when a
      # variable is UNSET — an empty $HOME would otherwise mount /data.
      #
      # These directories must exist before the first start: Docker creates a
      # missing bind-mount source as root, and the host user then cannot write
      # to it.
      - ${SPECTER_HOME:-${HOME}/.specter}/data:/app/data
      - ${SPECTER_HOME:-${HOME}/.specter}/artifacts:/app/artifacts
      - ${SPECTER_HOME:-${HOME}/.specter}/secrets:/app/secrets
      # Stays repo-relative: this is the code being worked on, not app state.
      - ./codebases:/app/codebases:ro
